services:
  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          memory: 256M

  backend:
    build: ./backend
    restart: always
    env_file:
      - ./backend/.env
    environment:
      - SMTP_HOST=smtp
      - SMTP_PORT=25
      - SMTP_SECURE=false
    volumes:
      - ./backend/data:/app/data
    depends_on:
      - cache
      - smtp
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 4G

  image-service:
    build: ./backend/image-service
    restart: always
    env_file:
      - ./backend/image-service/.env
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 1G

  order-processor:
    build: ./backend/order-processor
    restart: always
    env_file:
      - ./backend/order-processor/.env
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 512M

  scraper-worker:
    build: ./backend/scraper-service
    container_name: stockbud-scraper-worker
    restart: always
    env_file:
      - ./backend/scraper-service/.env
    environment:
      - PORT=3005
    deploy:
      resources:
        limits:
          memory: 2G

  meta-app:
    build: ./meta_app
    container_name: stockbud-meta-app
    restart: always
    ports:
      - "3006:3006"
    environment:
      - PORT=3006
      - BACKEND_URL=http://backend:3000
    deploy:
      resources:
        limits:
          memory: 512M

  cache:
    image: redis:7-alpine
    container_name: redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

  smtp:
    image: namshi/smtp
    container_name: stockbud-smtp
    restart: always
    ports:
      - "25:25"

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    deploy:
      resources:
        limits:
          memory: 512M

  grafana:
    image: grafana/grafana-oss:latest
    container_name: grafana
    restart: always
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    deploy:
      resources:
        limits:
          memory: 512M

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.47.2
    container_name: cadvisor
    restart: always
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    deploy:
      resources:
        limits:
          memory: 400M

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    restart: always
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    deploy:
      resources:
        limits:
          memory: 100M

  redis-exporter:
    image: oliver006/redis_exporter
    restart: always
    environment:
      - REDIS_ADDR=redis:6379
    depends_on:
      - cache

volumes:
  redis_data:
  grafana_data:
