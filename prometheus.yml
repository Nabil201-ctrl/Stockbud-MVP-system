global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: stockbud-backend
    static_configs:
      - targets: ['backend:3000']
    metrics_path: /metrics

  - job_name: stockbud-image-service
    static_configs:
      - targets: ['image-service:3002']
    metrics_path: /metrics

  - job_name: stockbud-order-processor
    static_configs:
      - targets: ['order-processor:3003']
    metrics_path: /metrics

  - job_name: stockbud-scraper-worker
    static_configs:
      - targets: ['scraper-worker:3005']
    metrics_path: /metrics

  - job_name: cadvisor
    static_configs:
      - targets: ['cadvisor:8080']

  - job_name: node-exporter
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: redis
    static_configs:
      - targets: ['redis-exporter:9121']
